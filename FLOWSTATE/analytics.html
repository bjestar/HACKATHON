
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowstate | Analytics</title>

    <link rel="stylesheet" href="style.css">

    <script src="auth.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>

 <!-- SIDEBAR -->
<aside class="sidebar">

    <div class="logo">
        <h2>FLOWSTATE<span>.</span></h2>
    </div>

    <nav class="navigation">
        <p>MENU</p>

        <a href="index.html">Overview</a>
        <a href="tasks.html">My Tasks</a>
        <a href="focus.html">Focus Mode</a>
        <a href="analytics.html">Analytics</a>
            <a href="challenge.html" class="active">Mini Games</a>

        <!-- FOCUS SOUNDS -->
        <div class="music-menu">

            <button type="button" id="music-toggle" class="music-toggle">
                <span>♫</span>
                Focus Sounds
                <span id="music-arrow">⌄</span>
            </button>

            <div id="music-options" class="music-options">

                <button type="button" class="sound-option" data-sound="rain">
                    🌧️ Rain
                </button>

                <button type="button" class="sound-option" data-sound="forest">
                    🌲 Forest
                </button>

                <button type="button" class="sound-option" data-sound="noise">
                    🌊 Sea
                </button>

                <div class="music-controls">
                    <button type="button" id="play-sound">▶</button>
                    <button type="button" id="pause-sound">Ⅱ</button>
                </div>

            </div>
        </div>

    </nav>

    <div class="sidebar-bottom">

    </div>

</aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header>
            <h1>Productivity Analytics</h1>
            <p>Track your progress and celebrate your achievements.</p>
        </header>


        <!-- STATISTICS -->
        <section class="stats-container">

            <div class="stat-card">
                <h3>Total Tasks</h3>
                <h2 id="total-tasks">0</h2>
            </div>

            <div class="stat-card">
                <h3>Completed Tasks</h3>
                <h2 id="completed-tasks">0</h2>
            </div>

            <div class="stat-card">
                <h3>Productivity Rate</h3>
                <h2 id="productivity-rate">0%</h2>
            </div>

        </section>


        <!-- OVERALL PROGRESS -->
        <section class="analytics-card">

            <h2>Overall Progress</h2>

            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>

            <p id="progress-text">0% completed</p>

        </section>


        <!-- DAILY STREAK -->
        <section class="analytics-card">

            <h2>Your Daily Streak</h2>

            <h1 id="streak-count">0 days</h1>

            <p>Keep completing tasks every day!</p>

        </section>

    </main>

</body>
</html>
