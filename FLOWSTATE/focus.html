
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowstate | Focus Mode</title>

    <link rel="stylesheet" href="style.css">

    <script src="auth.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>

    <!-- SIDEBAR -->
<aside class="sidebar">

    <div class="logo">
        <h2>FLOWSTATE<span>.</span></h2>
    </div>

    <nav class="navigation">
        <p>MENU</p>

        <a href="index.html">Overview</a>
        <a href="tasks.html">My Tasks</a>
        <a href="focus.html">Focus Mode</a>
        <a href="analytics.html">Analytics</a>
            <a href="challenge.html" class="active">Mini Games</a>

        <!-- FOCUS SOUNDS -->
        <div class="music-menu">

            <button type="button" id="music-toggle" class="music-toggle">
                <span>♫</span>
                Focus Sounds
                <span id="music-arrow">⌄</span>
            </button>

            <div id="music-options" class="music-options">

                <button type="button" class="sound-option" data-sound="rain">
                    🌧️ Rain
                </button>

                <button type="button" class="sound-option" data-sound="forest">
                    🌲 Forest
                </button>

                <button type="button" class="sound-option" data-sound="noise">
                    🌊 Sea
                </button>

                <div class="music-controls">
                    <button type="button" id="play-sound">▶</button>
                    <button type="button" id="pause-sound">Ⅱ</button>
                </div>

            </div>
        </div>

    </nav>

    <div class="sidebar-bottom">

    </div>

</aside>


    <main class="main-content">

        <header>
            <h1>Focus Mode</h1>
            <p>Stay focused. One task at a time.</p>
        </header>

        <section class="focus-container">

            <div class="focus-card">

                <h2>Pomodoro Timer</h2>

                <p>25 minutes of deep focus</p>

                <div id="timer">25:00</div>

                <div class="timer-buttons">
                    <button id="start-timer">Start</button>
                    <button id="pause-timer">Pause</button>
                    <button id="reset-timer">Reset</button>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
